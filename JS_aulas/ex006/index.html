<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistemas de Multas</h1>
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> km\h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">

    </div>

    <script>
        function calcular(){
            let velocidade = document.getElementById('txtvel').value;
            let velocidadeNum = Number(velocidade);
            let res = document.getElementById('res')

            res.innerHTML = `<p>Sua velocidade atual é de <strong>${velocidadeNum} km/h</strong></p>`;

            if (velocidadeNum > 60){
                res.innerHTML += '<p> Você ultrapassou a velocidade permitida. MULTADO!</p>'
            } 
            res.innerHTML += '<p>Diriga sempre com sinto de segurança!</p>'

        }
    </script>
</body>
</html>
